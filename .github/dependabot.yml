version: 2
# Security updates fire immediately regardless of schedule.
# Transitive Go dep security bumps are handled by vuln-autofix — Dependabot does not bump transitives.
# Routine version updates are disabled (open-pull-requests-limit: 0) on every
# ecosystem below, so every PR Dependabot opens here is a security update — this
# is what lets the shared dependabot-auto-merge workflow merge unconditionally.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
